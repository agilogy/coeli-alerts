name: Build

on:
  pull_request:
    branches: [main]
  # Builds on main are the only ones that save the Gradle cache that pull request builds read.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub Packages, where the architecture-check plugin comes from.
      ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build koverXmlReport --continue
      - name: Upload the architecture report
        id: architecture-report
        if: ${{ !cancelled() && hashFiles('build/reports/architecture/report.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/reports/architecture/report.html
          # Uploaded as is, so the link opens the page instead of downloading a zip.
          archive: false
      - name: Architecture report
        if: ${{ !cancelled() && hashFiles('build/reports/architecture/report.md') != '' }}
        env:
          REPORT_URL: ${{ steps.architecture-report.outputs.artifact-url }}
        run: |
          cat build/reports/architecture/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_URL" ]; then echo "[The report as a page]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        # Dependabot pull requests get a read-only token, which can't create the check.
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        with:
          name: Tests
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit
          fail-on-empty: false
          use-actions-summary: false
      - name: Coverage report
        uses: mi-kas/kover-report@94d69bc9d417de89b808cd5fe846bca2840911bb # v2.7
        # Only pull requests get the comment; Dependabot's read-only token can't write it.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        with:
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          title: Code coverage
          update-comment: true
          coverage-counter-type: LINE
